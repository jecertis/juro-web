<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=/blog/dpdp-processor-guide">
<title>Redirecting — Jurocompliant</title>
<link rel="canonical" href="https://jurocompliant.com/blog/dpdp-processor-guide"/>
</head>
<body>
<script src="/config.js"></script>
<script>
// First-party pageview beacon for this legacy URL, fired BEFORE the
// redirect below so old-link usage stays visible in /admin/pageviews.
// keepalive lets the POST survive the navigation; see privacy.html for
// the fetch-vs-sendBeacon rationale.
(function beacon() {
  try {
    var base = (window.JURO_API_URL) || 'http://localhost:3000';
    var q = new URLSearchParams(window.location.search);
    var payload = {
      path: window.location.pathname,
      referrer: document.referrer || undefined,
      utm_source: q.get('utm_source') || undefined,
      utm_medium: q.get('utm_medium') || undefined,
      utm_campaign: q.get('utm_campaign') || undefined,
    };
    fetch(base + '/api/v1/pageview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      keepalive: true,
      mode: 'cors',
      credentials: 'omit',
    }).catch(function () { /* fire-and-forget */ });
  } catch (_) { /* never block the redirect */ }
})();
</script>
<script>window.location.replace('/blog/dpdp-processor-guide');</script>
</body>
</html>
