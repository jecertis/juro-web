<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juro — Business Card</title>
<meta name="description" content="Redirecting to the Juro strawman scan.">
<meta http-equiv="refresh" content="0;url=https://jurocompliant.com/strawman-scan.html?utm_source=business_card&utm_medium=qr&utm_campaign=strawman_scan&utm_content=card_qr">
<!-- Redirect target, not a content page: this URL exists only so the founder's
     business-card QR can encode a short link instead of the full tagged URL.
     Keep it out of the index so it never competes with /strawman-scan or
     /about in search results. -->
<!-- noindex with no canonical: declaring a page canonical to itself while telling
     crawlers not to index it is contradictory signalling. On a noindex redirect
     stub the canonical adds nothing. -->
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0A0A0A">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0A0A0A; color: #ECEEF3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 2rem;
  }
  .wrap { max-width: 34rem; display: flex; flex-direction: column; gap: 0.9rem; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; color: #8A93A6; font-size: 1rem; line-height: 1.55; }
  a { color: #F0B429; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Taking you to the Juro scan&hellip;</h1>
    <p>If you're not redirected, <a id="fallback" href="https://jurocompliant.com/strawman-scan.html?utm_source=business_card&utm_medium=qr&utm_campaign=strawman_scan&utm_content=card_qr">click here</a>.</p>
  </div>

<script>
  // JS fallback in case the meta refresh is stripped or delayed by a QR-scanner
  // in-app browser. location.replace (not location.href) so this redirect stub
  // never occupies a back-button entry between the QR scan and the destination.
  (function () {
    var DEST = 'https://jurocompliant.com/strawman-scan.html?utm_source=business_card&utm_medium=qr&utm_campaign=strawman_scan&utm_content=card_qr';
    window.location.replace(DEST);
  })();
</script>
</body>
</html>
