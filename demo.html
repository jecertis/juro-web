<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book a Juro walkthrough — JuroCompliant</title>
<meta name="description" content="Book a 20-minute walkthrough of Juro's non-custodial compliance scanner for DPDP, GDPR, and DORA.">
<!-- Redirect target, not a content page: keep it out of the index so it never
     competes with /about or /install in search results. -->
<!-- noindex with no canonical: declaring a page canonical to itself while telling
     crawlers not to index it is contradictory signalling. On a noindex redirect
     stub the canonical adds nothing. -->
<meta name="robots" content="noindex, follow">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#0A0A0A">

<script src="/config.js"></script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0A0A0A; color: #ECEEF3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center; padding: 2rem;
  }
  .wrap { max-width: 34rem; display: flex; flex-direction: column; gap: 0.9rem; }
  h1 { font-size: 1.5rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  p { margin: 0; color: #8A93A6; font-size: 1rem; line-height: 1.55; }
  a { color: #F0B429; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Taking you to the booking page&hellip;</h1>
    <p>If nothing happens, <a id="fallback" href="https://cal.com/jecertis.com/juro-compliance-demo-20-min">open it directly</a>.</p>
  </div>

<script>
  // Attribution: UTMs are appended to the cal.com destination so a booking that
  // originates from the demo video is distinguishable from outbound email.
  // Any utm_* already on THIS url (e.g. from a specific placement) wins, so the
  // same /demo path can be reused across placements without editing this file.
  (function () {
    var DEST = 'https://cal.com/jecertis.com/juro-compliance-demo-20-min';
    var DEFAULTS = { utm_source: 'demo-video', utm_medium: 'video', utm_campaign: 'bl-eng-113-demo' };

    // Allowlist: forward utm_* only. An earlier version forwarded EVERY incoming
    // param, which let anyone craft jurocompliant.com/demo?name=X&email=y@z --
    // cal.com honours those as booking prefill, so a link that looks like it came
    // from us would land on a real booking form with someone else's details in it.
    // Nothing needs the catch-all: reuse across placements is served by the
    // utm_* override below.
    var incoming = new URLSearchParams(window.location.search);
    var out = new URLSearchParams();
    Object.keys(DEFAULTS).forEach(function (k) {
      out.set(k, incoming.get(k) || DEFAULTS[k]);
    });
    incoming.forEach(function (v, k) {
      if (k.indexOf('utm_') === 0 && !out.has(k)) out.set(k, v);
    });

    var target = DEST + '?' + out.toString();
    document.getElementById('fallback').href = target;

    // Record the visit before leaving, so the video is measurable even when the
    // viewer does not complete a booking. Fire-and-forget; never blocks the hop.
    try {
      var base = (window.JURO_API_URL) || 'http://localhost:3000';
      fetch(base + '/api/v1/pageview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          path: window.location.pathname,
          referrer: document.referrer || undefined,
          utm_source: out.get('utm_source'),
          utm_medium: out.get('utm_medium'),
          utm_campaign: out.get('utm_campaign')
        }),
        keepalive: true, mode: 'cors', credentials: 'omit'
      }).catch(function () {});
    } catch (_) {}

    setTimeout(function () { window.location.replace(target); }, 250);
  })();
</script>
</body>
</html>
