name: Workspace compliance checks

on:
  pull_request:
    paths:
      - 'README.md'
      - 'package.json'
      - '**/*.html'
      - '.github/scripts/**'
      - '.github/contracts/**'
      - '.github/workflows/banned-claims.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout juro-web
        uses: actions/checkout@v7

      - name: Make scripts executable
        # Scripts are vendored from juro-platform/scripts/. juro-platform
        # is private, so cross-repo checkout would require a PAT secret.
        # See .github/scripts/check-banned-claims.sh header for re-vendor
        # protocol when the canonical list changes.
        run: chmod +x .github/scripts/check-banned-claims.sh .github/scripts/check-agent-preamble.sh .github/scripts/check-claim-backing.sh

      - name: Collect files for compliance checks
        id: files
        run: |
          set -e
          files=()
          [[ -f README.md ]] && files+=("README.md")
          [[ -f package.json ]] && files+=("package.json")
          while IFS= read -r -d '' f; do files+=("$f"); done < <(find . -maxdepth 2 -name '*.html' -not -path './node_modules/*' -print0 2>/dev/null || true)
          printf '%s\n' "${files[@]}" > files.txt
          cat files.txt

      - name: Run banned-claims check
        run: xargs -a files.txt .github/scripts/check-banned-claims.sh

      - name: Run claim-backing check
        # Positive-claim check, complementary to banned-claims: catches
        # asserting a capability that isn't shipped yet, even if the exact
        # wording was never on the banned-phrase list (BL-ENG-149's class).
        run: xargs -a files.txt .github/scripts/check-claim-backing.sh


