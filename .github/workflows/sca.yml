name: Dependency Scan (SCA)

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.github/workflows/sca.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'npm-shrinkwrap.json'
      - '.github/workflows/sca.yml'
  # BL-ENG-252: npm audit reads a live advisory feed, so an advisory disclosed
  # after the last dependency change goes unseen until the next PR that happens
  # to touch the lockfile. A weekly run re-audits the unchanged locked tree.
  # Mondays 03:30 UTC (09:00 IST). Scheduled runs only fire from the default
  # branch.
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: false
